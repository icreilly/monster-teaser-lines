name: Refresh NFL lines

on:
  # 12:00 UTC = 8am ET during daylight saving, 7am ET once it ends in November.
  # GitHub's scheduler is best-effort and can run several minutes late.
  schedule:
    - cron: "0 12 * * *"
  # Lets you run it on demand from the Actions tab.
  workflow_dispatch:

# Required so the job can commit the new snapshot back to the repo.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch DraftKings lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_odds.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No line changes since the last run; nothing to commit."
          else
            git commit -m "Update NFL lines: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
